########################### NETWORKS
networks:
  default:
    driver: bridge
  socket_proxy:
    name: socket_proxy
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.91.0/24
  reverse_proxy:
    name: reverse_proxy
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.90.0/24

########################### SECRETS
secrets:
  ### CORE
  cloudflare_traefik_key:
    file: $DOCKERDIR/secrets/cloudflare_traefik_key
  traefik_forward_auth:
    file: $DOCKERDIR/secrets/traefik_forward_auth
  wireguard_preshared_key:
    file: $DOCKERDIR/secrets/wireguard_preshared_key
  wireguard_private_key:
    file: $DOCKERDIR/secrets/wireguard_private_key
  ### ADMIN
  portainer_key:
    file: $DOCKERDIR/secrets/portainer_key
  proxmox_username:
    file: $DOCKERDIR/secrets/proxmox_username
  proxmox_password:
    file: $DOCKERDIR/secrets/proxmox_password
  ### MEDIA
  immich_key:
    file: $DOCKERDIR/secrets/immich_key
  jellyfin_key:
    file: $DOCKERDIR/secrets/jellyfin_key
  nextcloud_key:
    file: $DOCKERDIR/secrets/nextcloud_key
  nextcloud_db_password:
    file: $DOCKERDIR/secrets/nextcloud_db_password
  navidrome_user:
    file: $DOCKERDIR/secrets/navidrome_user
  navidrome_token:
    file: $DOCKERDIR/secrets/navidrome_token
  navidrome_salt:
    file: $DOCKERDIR/secrets/navidrome_salt
  ### ARR
  sonarr_key:
    file: $DOCKERDIR/secrets/sonarr_key
  radarr_key:
    file: $DOCKERDIR/secrets/radarr_key
  lidarr_key:
    file: $DOCKERDIR/secrets/lidarr_key
  bazarr_key:
    file: $DOCKERDIR/secrets/bazarr_key
  prowlarr_key:
    file: $DOCKERDIR/secrets/prowlarr_key
  ### TOOLS
  jellyseerr_key:
    file: $DOCKERDIR/secrets/jellyseerr_key
  notifiarr_key:
    file: $DOCKERDIR/secrets/notifiarr_key
  unpackerr_notification_url:
    file: $DOCKERDIR/secrets/unpackerr_notification_url
  ### MAINTENANCE
  watchtower_key:
    file: $DOCKERDIR/secrets/watchtower_key
  watchtower_notification_url:
    file: $DOCKERDIR/secrets/watchtower_notification_url
  ### SECURITY
  crowdsec_discord_webhook:
    file: $DOCKERDIR/secrets/crowdsec_discord_webhook

########################### SERVICES
include:
  ### CORE
  - compose/core/traefik.yml
  - compose/core/socket-proxy.yml
  - compose/core/oauth.yml
  - compose/core/gluetun.yml
  ### ADMIN
  - compose/admin/dockge.yml
  - compose/admin/dozzle.yml
  - compose/admin/portainer.yml
  - compose/admin/homepage.yml
  ### MEDIA
  - compose/media/immich.yml
  - compose/media/jellyfin.yml
  - compose/media/nextcloud.yml
  - compose/media/navidrome.yml
  ### ARR
  - compose/arr/sonarr.yml
  - compose/arr/radarr.yml
  - compose/arr/lidarr.yml
  - compose/arr/prowlarr.yml
  - compose/arr/bazarr.yml
  ### DOWNLOADERS
  - compose/downloaders/qbittorrent.yml
  - compose/downloaders/slskd.yml
  ### TOOLS
  - compose/tools/jellyseerr.yml
  - compose/tools/neko.yml
  - compose/tools/notifiarr.yml
  - compose/tools/wizarr.yml
  - compose/tools/unpackerr.yml
  - compose/tools/llama-cpp.yml
  - compose/tools/audiomuse-ai.yml
  - compose/tools/beets.yml
  - compose/tools/essentia-tagger.yml
  - compose/tools/aurral.yml
  ### MAINTENANCE
  - compose/maintenance/deunhealth.yml
  - compose/maintenance/docker-gc.yml
  - compose/maintenance/ofelia.yml
  - compose/maintenance/watchtower.yml
  ### SECURITY
#  - compose/security/crowdsec.yml
