services:
  # Essentia - ML-based mood detection and audio tagging
  essentia:
    build:
      context: https://github.com/WB2024/Essentia-to-Metadata.git
    container_name: essentia
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    profiles: ["apps", "tools", "all"]
    entrypoint: ["tail", "-f", "/dev/null"]
    volumes:
      - $DOCKERDIR/data/media/music:/music
      - $DOCKERDIR/scripts/essentia_tag_supported.py:/usr/local/bin/essentia-tag-supported:ro
    environment:
      TZ: $TZ
    labels:
      ### Homepage
      - "homepage.group=Tools"
      - "homepage.name=Essentia Tagger"
      - "homepage.icon=essentia.png"
      - "homepage.description=Mood tag analyzer"
      ### Ofelia — runs after beets import window; skips already-tagged files
      - "ofelia.enabled=true"
      - "ofelia.job-exec.essentia-tag.schedule=@every 6h"
      - "ofelia.job-exec.essentia-tag.command=python /usr/local/bin/essentia-tag-supported /music --auto --no-genres --model-dir /app/essentia_models"
