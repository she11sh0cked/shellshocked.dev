services:
  # Prowlarr - Torrent proxy
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:develop
    container_name: prowlarr
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    profiles: ["apps", "arr", "all"]
    networks:
      - reverse_proxy
    volumes:
      - $DOCKERDIR/appdata/prowlarr:/config
      - "/etc/localtime:/etc/localtime:ro"
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
    labels:
      ### Traefik
      - "traefik.enable=true"
      # HTTP Routers
      - "traefik.http.routers.prowlarr-rtr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr-rtr.rule=Host(`prowlarr.$DOMAINNAME`)"
      # Middlewares
      - "traefik.http.routers.prowlarr-rtr.middlewares=chain-oauth@file"
      # HTTP Services
      - "traefik.http.routers.prowlarr-rtr.service=prowlarr-svc"
      - "traefik.http.services.prowlarr-svc.loadbalancer.server.port=9696"
      # API router - bypasses OAuth when X-Api-Key header is present
      - "traefik.http.routers.prowlarr-api-rtr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr-api-rtr.rule=Host(`prowlarr.$DOMAINNAME`) && PathPrefix(`/api`) && HeadersRegexp(`X-Api-Key`, `.+`)"
      - "traefik.http.routers.prowlarr-api-rtr.middlewares=chain-no-auth@file"
      - "traefik.http.routers.prowlarr-api-rtr.service=prowlarr-svc"
      - "traefik.http.routers.prowlarr-api-rtr.priority=99"
      ### Homepage
      - "homepage.group=Arr"
      - "homepage.name=Prowlarr"
      - "homepage.icon=prowlarr.png"
      - "homepage.href=https://prowlarr.$DOMAINNAME"
      - "homepage.description=Torrent proxy"
      - "homepage.widget.type=prowlarr"
      - "homepage.widget.url=http://prowlarr:9696"
      - "homepage.widget.key={{HOMEPAGE_FILE_PROWLARR_KEY}}"
