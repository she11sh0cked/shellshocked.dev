services:
  # Dispatcharr - IPTV Stream and EPG Manager
  dispatcharr:
    image: ghcr.io/dispatcharr/dispatcharr:latest
    container_name: dispatcharr
    security_opt:
      - no-new-privileges:true
    depends_on:
      gluetun-de:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["apps", "media", "all"]
    # All traffic leaves through the German VPN exit; Traefik labels live on gluetun-de.
    network_mode: "service:gluetun-de"
    volumes:
      - $DOCKERDIR/appdata/dispatcharr:/data
    environment:
      TZ: $TZ
      DISPATCHARR_ENV: aio
      REDIS_HOST: localhost
      CELERY_BROKER_URL: redis://localhost:6379/0
      DISPATCHARR_LOG_LEVEL: info
    healthcheck:
      test: "curl -sf -o /dev/null http://127.0.0.1:9191 || exit 1"
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 2m
    labels:
      - "deunhealth.restart.on.unhealthy=true"
      ### Homepage
      - "homepage.group=Media"
      - "homepage.name=Dispatcharr"
      - "homepage.icon=dispatcharr.png"
      - "homepage.href=https://dispatcharr.$DOMAINNAME"
      - "homepage.description=IPTV Stream and EPG Manager"
